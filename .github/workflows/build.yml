name: Build BluApp APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Make gradlew executable
      run: chmod +x gradlew
    
    - name: Build APK
      run: ./gradlew assembleDebug --no-daemon -Dorg.gradle.dependency.verification=off
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: BluApp-debug
        path: app/build/outputs/apk/debug/app-debug.apk
